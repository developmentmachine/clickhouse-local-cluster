name: clickhouse-local-cluster

x-zookeeper-environment: &zookeeper-environment
  ZOO_STANDALONE_ENABLED: "false"
  ZOO_ADMINSERVER_ENABLED: "false"
  ZOO_4LW_COMMANDS_WHITELIST: ruok,mntr,conf,srvr
  ZOO_HEAP_SIZE: "256"
  ZOO_SERVERS: >-
    server.1=zookeeper-01:2888:3888;2181
    server.2=zookeeper-02:2888:3888;2181
    server.3=zookeeper-03:2888:3888;2181

x-zookeeper-common: &zookeeper-common
  image: zookeeper:3.8.4
  restart: unless-stopped
  networks:
    - clickhouse-net
  mem_limit: 384m
  cpus: 0.5
  healthcheck:
    test: ["CMD-SHELL", "zkServer.sh status >/dev/null 2>&1"]
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 20s

x-clickhouse-common: &clickhouse-common
  image: clickhouse/clickhouse-server:22.3.2.2
  platform: linux/amd64
  restart: unless-stopped
  networks:
    - clickhouse-net
  mem_limit: 1200m
  cpus: 2.0
  ulimits:
    nofile:
      soft: 262144
      hard: 262144
  depends_on:
    zookeeper-01:
      condition: service_healthy
    zookeeper-02:
      condition: service_healthy
    zookeeper-03:
      condition: service_healthy
  healthcheck:
    test:
      ["CMD-SHELL", "clickhouse-client --port 9027 --query 'SELECT 1' >/dev/null 2>&1"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 60s

services:
  zookeeper-01:
    <<: *zookeeper-common
    container_name: clickhouse-local-zookeeper-01
    hostname: zookeeper-01
    environment:
      <<: *zookeeper-environment
      ZOO_MY_ID: "1"
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - ./data/zookeeper-01/data:/data
      - ./data/zookeeper-01/datalog:/datalog

  zookeeper-02:
    <<: *zookeeper-common
    container_name: clickhouse-local-zookeeper-02
    hostname: zookeeper-02
    environment:
      <<: *zookeeper-environment
      ZOO_MY_ID: "2"
    ports:
      - "127.0.0.1:2182:2181"
    volumes:
      - ./data/zookeeper-02/data:/data
      - ./data/zookeeper-02/datalog:/datalog

  zookeeper-03:
    <<: *zookeeper-common
    container_name: clickhouse-local-zookeeper-03
    hostname: zookeeper-03
    environment:
      <<: *zookeeper-environment
      ZOO_MY_ID: "3"
    ports:
      - "127.0.0.1:2183:2181"
    volumes:
      - ./data/zookeeper-03/data:/data
      - ./data/zookeeper-03/datalog:/datalog

  clickhouse-01:
    <<: *clickhouse-common
    container_name: clickhouse-local-clickhouse-01
    hostname: clickhouse-01
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9027:9027"
    volumes:
      - ./data/clickhouse-01:/var/lib/clickhouse
      - ./logs/clickhouse-01:/var/log/clickhouse-server
      - ./config/common/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/common/network.xml:/etc/clickhouse-server/config.d/network.xml:ro
      - ./config/common/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
      - ./config/common/users.xml:/etc/clickhouse-server/users.d/local-users.xml:ro
      - ./config/clickhouse-01/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro

  clickhouse-02:
    <<: *clickhouse-common
    container_name: clickhouse-local-clickhouse-02
    hostname: clickhouse-02
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9028:9027"
    volumes:
      - ./data/clickhouse-02:/var/lib/clickhouse
      - ./logs/clickhouse-02:/var/log/clickhouse-server
      - ./config/common/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/common/network.xml:/etc/clickhouse-server/config.d/network.xml:ro
      - ./config/common/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
      - ./config/common/users.xml:/etc/clickhouse-server/users.d/local-users.xml:ro
      - ./config/clickhouse-02/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro

  clickhouse-03:
    <<: *clickhouse-common
    container_name: clickhouse-local-clickhouse-03
    hostname: clickhouse-03
    ports:
      - "127.0.0.1:8125:8123"
      - "127.0.0.1:9029:9027"
    volumes:
      - ./data/clickhouse-03:/var/lib/clickhouse
      - ./logs/clickhouse-03:/var/log/clickhouse-server
      - ./config/common/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/common/network.xml:/etc/clickhouse-server/config.d/network.xml:ro
      - ./config/common/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
      - ./config/common/users.xml:/etc/clickhouse-server/users.d/local-users.xml:ro
      - ./config/clickhouse-03/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro

networks:
  clickhouse-net:
    name: clickhouse-local-net
